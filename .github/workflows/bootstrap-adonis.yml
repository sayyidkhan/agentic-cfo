# One-time bootstrap into the existing project. Runs only when this file changes.
# Subsequent source commits do not retrigger scaffolding.
name: Bootstrap official AdonisJS React starter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-adonis.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scaffold official AdonisJS 7 React/Inertia starter
        env:
          CI: 'true'
        run: |
          npm create adonisjs@latest /tmp/agentic-cfo-starter -- --kit=react --pkg=npm
      - name: Merge generated starter without overwriting product code or docs
        run: |
          rsync -a --ignore-existing \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='tmp/*.sqlite' \
            --exclude='.github/' \
            /tmp/agentic-cfo-starter/ ./
          git status --short
      - name: Commit the official generated scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: add official AdonisJS React SQLite starter [skip ci]"
            git push origin main
          fi
