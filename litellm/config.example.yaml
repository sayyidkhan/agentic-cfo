# Example shared LiteLLM gateway configuration, NOT deployed by this repository.
# LiteLLM gateway is a separate Python service. Do not commit auth.json or proxy keys.
# The ChatGPT subscription provider requires interactive OAuth before starting the proxy.
# Verify that your chosen ChatGPT plan/model supports this LiteLLM subscription route.
model_list:
  - model_name: agentic-cfo
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.4

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
