<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
 <defs>
  <linearGradient id="forest" x1="12" y1="4" x2="85" y2="96" gradientUnits="userSpaceOnUse"><stop stop-color="#28614e"/><stop offset=".55" stop-color="#174c3c"/><stop offset="1" stop-color="#103b30"/></linearGradient>
  <linearGradient id="gold" x1="30" y1="40" x2="70" y2="75" gradientUnits="userSpaceOnUse"><stop stop-color="#f6e9c6"/><stop offset=".52" stop-color="#e4cd94"/><stop offset="1" stop-color="#bd9557"/></linearGradient>
  <linearGradient id="cap" x1="28" y1="28" x2="71" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#f5e7bc"/><stop offset="1" stop-color="#c9a667"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="28" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#fff9e8" stop-opacity="0"/><stop offset=".5" stop-color="#fff9e8" stop-opacity=".7"/><stop offset="1" stop-color="#fff9e8" stop-opacity="0"/></linearGradient>
  <clipPath id="acorn-surface"><path d="M28 44h40c-.3 14.8-6.8 24.7-17.5 31.6a4.6 4.6 0 0 1-5 0C34.8 68.7 28.3 58.8 28 44Z"/><path d="M24 43.2C25.7 33.1 35 29 48 29s22.3 4.1 24 14.2c.2 1.6-1 3.1-2.7 3.1H26.7c-1.7 0-2.9-1.5-2.7-3.1Z"/></clipPath>
 </defs>
 <rect width="96" height="96" rx="26" fill="url(#forest)"/>
 <rect x="1.5" y="1.5" width="93" height="93" rx="24.5" stroke="#f1e3b7" stroke-opacity=".16"/>
 <style>
 /* One coordinated growth gesture, followed by a quiet hold. The tile stays fixed. */
 .acorra-seed,.acorra-sprout,.acorra-leaf,.acorra-sheen{transform-box:view-box;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.4,0,.2,1)}
 .acorra-seed{transform-origin:48px 74px;animation-name:acorra-lift}
 .acorra-sprout{transform-origin:48px 31px;animation-name:acorra-sprout}
 .acorra-leaf-right{transform-origin:51px 24px;animation-name:acorra-leaf-right}
 .acorra-leaf-left{transform-origin:47.5px 28px;animation-name:acorra-leaf-left}
 .acorra-sheen{opacity:0;animation-name:acorra-sheen}
 @keyframes acorra-lift{
  0%,5%,44%,100%{transform:translateY(0) scale(1)}
  11%{transform:translateY(1px) scale(1.025,.975)}
  23%{transform:translateY(-4px) scale(.99,1.025)}
  34%{transform:translateY(.5px) scale(1.01,.99)}
 }
 @keyframes acorra-sprout{
  0%,5%,46%,100%{transform:rotate(0) scale(1)}
  12%{transform:rotate(-7deg) scale(.95)}
  25%{transform:rotate(5deg) scale(1.08)}
  36%{transform:rotate(-2deg) scale(1.02)}
 }
 @keyframes acorra-leaf-right{
  0%,5%,46%,100%{transform:rotate(0) scale(1)}
  13%{transform:rotate(18deg) scale(.86,1)}
  27%{transform:rotate(-12deg) scale(1.12,1.05)}
  37%{transform:rotate(3deg) scale(1)}
 }
 @keyframes acorra-leaf-left{
  0%,8%,49%,100%{transform:rotate(0) scale(1)}
  16%{transform:rotate(-16deg) scale(.88,1)}
  30%{transform:rotate(14deg) scale(1.12,1.04)}
  40%{transform:rotate(-3deg) scale(1)}
 }
 @keyframes acorra-sheen{
  0%,22%{transform:translateX(-30px);opacity:0}
  25%{opacity:.7}
  39%{transform:translateX(100px);opacity:.7}
  40%,100%{transform:translateX(100px);opacity:0}
 }
 @media(prefers-reduced-motion:reduce){.acorra-seed,.acorra-sprout,.acorra-leaf,.acorra-sheen{animation:none}.acorra-sheen{opacity:0}}
 </style>
 <g class="acorra-seed">
 <path d="M28 44h40c-.3 14.8-6.8 24.7-17.5 31.6a4.6 4.6 0 0 1-5 0C34.8 68.7 28.3 58.8 28 44Z" fill="url(#gold)"/>
 <path d="M33 48c1.1 9.9 5.9 18.1 12.5 23.3" stroke="#fff5d6" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
 <g class="acorra-sprout">
 <path d="M48 34V24c0-5.4 3.2-9.3 7-11" stroke="#e9d5a3" stroke-width="3.5" stroke-linecap="round"/>
 <path class="acorra-leaf acorra-leaf-right" d="M51 24c.2-8 5.4-12.2 14-11.5C64.3 20.7 59.5 25.3 51 24Z" fill="url(#gold)"/>
 <path class="acorra-leaf acorra-leaf-left" d="M47.5 28c-6.4.3-10.2-3.1-11-9.2 6.5-.5 10.6 2.6 11 9.2Z" fill="#b4c59a"/>
 </g>
 <path d="M24 43.2C25.7 33.1 35 29 48 29s22.3 4.1 24 14.2c.2 1.6-1 3.1-2.7 3.1H26.7c-1.7 0-2.9-1.5-2.7-3.1Z" fill="url(#cap)"/>
 <path d="m35 33 10 11m1-13 12 13m2-11 8 9M28 41l9-8m2 11 13-13m0 13 11-10" stroke="#735937" stroke-opacity=".25" stroke-width="1.7" stroke-linecap="round"/>
 <path d="M27 46.2h42" stroke="#103b30" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
 <g clip-path="url(#acorn-surface)"><path class="acorra-sheen" d="M0 25h28v55H0Z" fill="url(#sheen)"/></g>
 </g>
</svg>
